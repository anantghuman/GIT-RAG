apiVersion: v1
kind: Secret
metadata:
  name: git-rag-secrets
  namespace: git-rag
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@RDS_ENDPOINT:5432/gitrag
  REDIS_URL: redis://ELASTICACHE_ENDPOINT:6379/0
  KAFKA_BOOTSTRAP_SERVERS: MSK_BROKER_1:9092,MSK_BROKER_2:9092
  S3_BUCKET: git-rag-prod
  PINECONE_API_KEY: replace-me
  OPENAI_API_KEY: replace-me
  GITHUB_WEBHOOK_SECRET: replace-me
  GITHUB_ACCESS_TOKEN: replace-me
