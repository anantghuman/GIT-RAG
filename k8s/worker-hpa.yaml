apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: git-rag-worker
  namespace: git-rag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: git-rag-worker
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
