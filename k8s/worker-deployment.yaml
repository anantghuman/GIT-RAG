apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-rag-worker
  namespace: git-rag
spec:
  replicas: 4
  selector:
    matchLabels:
      app: git-rag-worker
  template:
    metadata:
      labels:
        app: git-rag-worker
    spec:
      containers:
        - name: worker
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/git-rag-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: git-rag-config
            - secretRef:
                name: git-rag-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: repo-cache
              mountPath: /data
      volumes:
        - name: repo-cache
          emptyDir: {}
